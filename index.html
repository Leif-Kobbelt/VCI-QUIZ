/* ---------------- Zugang Dozenten-Ansicht ----------------

/* ---------------- Global state ---------------- */
const studentId = 'stu_' + Math.random().toString(36).slice(2) + Date.now().toString(36);

/* ---------------- Router ---------------- */
function route(){
  detachAllListeners();
  const hash = location.hash;
  if(hash === DOZENT_HASH){ renderDozentEntry(); }
  else if(hash === '#student'){ startStudent(); }
  else { renderLanding(); }

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

function detachAllListeners(){
  db.ref('quiz/current').off();
  detachAnswerListener();
}
function detachAnswerListener(){
  if(answersListenerRef){ answersListenerRef.off(); answersListenerRef = null; }
}

function studentUrl(){
  return location.origin + location.pathname + '#student';
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function storageWarningBanner(){
  if(!storageError) return '';
  return `<div class="panel" style="border-color:var(--red); margin-bottom:16px;">
    <strong style="color:var(--red);">Verbindung zu Firebase fehlgeschlagen:</strong>
    <div class="small-note" style="margin-top:6px;">${escapeHtml(storageError)}</div>
    <div class="small-note">Prüfe: Firebase-Konfiguration oben im Code korrekt eingetragen? Realtime Database aktiviert? Security Rules veröffentlicht? Internetverbindung vorhanden?</div>
  </div>`;
}

/* =========================================================
   QR-Code-Generator (kein externer Netzwerkaufruf).
   Byte-Modus, Fehlerkorrektur L, feste Maske 0, Versionen 1-10.
   ========================================================= */
const QRLib = (function(){
  const EXP_TABLE = new Array(256), LOG_TABLE = new Array(256);
  for(let i=0;i<8;i++){ EXP_TABLE[i] = 1<<i; }
  for(let i=8;i<256;i++){ EXP_TABLE[i] = EXP_TABLE[i-4]^EXP_TABLE[i-5]^EXP_TABLE[i-6]^EXP_TABLE[i-8]; }
  for(let i=0;i<255;i++){ LOG_TABLE[EXP_TABLE[i]] = i; }
  const glog = n => LOG_TABLE[n];
  const gexp = n => { while(n<0) n+=255; while(n>=256) n-=255; return EXP_TABLE[n]; };

  function Poly(num, shift){
    let offset=0;
    while(offset<num.length && num[offset]===0) offset++;
    this.num = new Array(num.length-offset+shift).fill(0);
    for(let i=0;i<num.length-offset;i++){ this.num[i]=num[i+offset]; }
  }
  Poly.prototype.get = function(i){ return this.num[i]; };
  Poly.prototype.len = function(){ return this.num.length; };
  Poly.prototype.multiply = function(e){
    const num = new Array(this.len()+e.len()-1).fill(0);
    for(let i=0;i<this.len();i++){ for(let j=0;j<e.len();j++){ num[i+j] ^= gexp(glog(this.get(i))+glog(e.get(j))); } }
    return new Poly(num,0);
  };
  Poly.prototype.mod = function(e){
    if(this.len()-e.len()<0) return this;
    const ratio = glog(this.get(0))-glog(e.get(0));
    const num = this.num.slice();
    for(let i=0;i<e.len();i++){ num[i] ^= gexp(glog(e.get(i))+ratio); }
    return new Poly(num,0).mod(e);
  };
  function errorCorrectPoly(len){
    let a = new Poly([1],0);
    for(let i=0;i<len;i++){ a = a.multiply(new Poly([1, gexp(i)],0)); }
    return a;
  }

  const PATTERN_POS = [[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const G15 = (1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|1;
  const G18 = (1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|1;
  const G15_MASK = (1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);
  function bchDigit(d){ let n=0; while(d!==0){ n++; d>>>=1; } return n; }
  function bchTypeInfo(data){
    let d = data<<10;
    while(bchDigit(d)-bchDigit(G15)>=0){ d ^= (G15<<(bchDigit(d)-bchDigit(G15))); }
    return ((data<<10)|d)^G15_MASK;
  }
  function bchTypeNumber(data){
    let d = data<<12;
    while(bchDigit(d)-bchDigit(G18)>=0){ d ^= (G18<<(bchDigit(d)-bchDigit(G18))); }
    return (data<<12)|d;
  }

  const RS_BLOCKS_L = [
    [[1,26,19]], [[1,44,34]], [[1,70,55]], [[1,100,80]], [[1,134,108]],
    [[2,86,68]], [[2,98,78]], [[2,121,97]], [[2,146,116]], [[2,86,68],[2,87,69]]
  ];
  function getRSBlocks(typeNumber){
    const groups = RS_BLOCKS_L[typeNumber-1];
    const blocks = [];
    groups.forEach(g => { for(let i=0;i<g[0];i++){ blocks.push({ totalCount:g[1], dataCount:g[2] }); } });
    return blocks;
  }

  function BitBuffer(){ this.buffer=[]; this.length=0; }
  BitBuffer.prototype.put = function(num, len){ for(let i=0;i<len;i++){ this.putBit(((num>>>(len-i-1))&1)===1); } };
  BitBuffer.prototype.putBit = function(bit){
    const idx = Math.floor(this.length/8);
    if(this.buffer.length<=idx) this.buffer.push(0);
    if(bit){ this.buffer[idx] |= (0x80>>>(this.length%8)); }
    this.length++;
  };

  function selectVersion(byteLength){
    for(let v=1; v<=10; v++){
      const lengthBits = v<=9 ? 8 : 16;
      const required = 4 + lengthBits + byteLength*8;
      const blocks = getRSBlocks(v);
      const totalData = blocks.reduce((s,b)=>s+b.dataCount, 0);
      if(totalData*8 >= required) return v;
    }
    return 10;
  }

  function createData(typeNumber, bytes){
    const blocks = getRSBlocks(typeNumber);
    const buf = new BitBuffer();
    buf.put(4,4);
    buf.put(bytes.length, typeNumber<=9 ? 8 : 16);
    bytes.forEach(b => buf.put(b,8));
    const totalDataCount = blocks.reduce((s,b)=>s+b.dataCount,0);
    if(buf.length+4<=totalDataCount*8){ buf.put(0,4); }
    while(buf.length%8!==0){ buf.putBit(false); }
    const PAD0=0xEC, PAD1=0x11;
    while(buf.length < totalDataCount*8){
      buf.put(PAD0,8);
      if(buf.length>=totalDataCount*8) break;
      buf.put(PAD1,8);
    }
    let offset=0, maxDc=0, maxEc=0;
    const dc=[], ec=[];
    blocks.forEach((blk,r) => {
      const dcCount = blk.dataCount, ecCount = blk.totalCount-dcCount;
      maxDc = Math.max(maxDc,dcCount); maxEc = Math.max(maxEc,ecCount);
      dc[r] = buf.buffer.slice(offset, offset+dcCount);
      offset += dcCount;
      const rsPoly = errorCorrectPoly(ecCount);
      const rawPoly = new Poly(dc[r], rsPoly.len()-1);
      const modPoly = rawPoly.mod(rsPoly);
      ec[r] = new Array(rsPoly.len()-1).fill(0);
      for(let i=0;i<ec[r].length;i++){
        const mi = i + modPoly.len() - ec[r].length;
        ec[r][i] = mi>=0 ? modPoly.get(mi) : 0;
      }
    });
    const total = blocks.reduce((s,b)=>s+b.totalCount,0);
    const data = new Array(total); let idx=0;
    for(let i=0;i<maxDc;i++){ blocks.forEach((b,r)=>{ if(i<dc[r].length) data[idx++]=dc[r][i]; }); }
    for(let i=0;i<maxEc;i++){ blocks.forEach((b,r)=>{ if(i<ec[r].length) data[idx++]=ec[r][i]; }); }
    return data;
  }

  function QRCode(typeNumber){
    this.typeNumber = typeNumber;
    this.moduleCount = typeNumber*4+17;
    this.modules = Array.from({length:this.moduleCount}, () => new Array(this.moduleCount).fill(null));
  }
  QRCode.prototype.setupFinder = function(row,col){
    for(let r=-1;r<=7;r++){
      if(row+r<=-1 || this.moduleCount<=row+r) continue;
      for(let c=-1;c<=7;c++){
        if(col+c<=-1 || this.moduleCount<=col+c) continue;
        const dark = (0<=r&&r<=6&&(c===0||c===6)) || (0<=c&&c<=6&&(r===0||r===6)) || (2<=r&&r<=4&&2<=c&&c<=4);
        this.modules[row+r][col+c] = dark;
      }
    }
  };
  QRCode.prototype.setupTiming = function(){
    for(let r=8;r<this.moduleCount-8;r++){ if(this.modules[r][6]===null) this.modules[r][6] = (r%2===0); }
    for(let c=8;c<this.moduleCount-8;c++){ if(this.modules[6][c]===null) this.modules[6][c] = (c%2===0); }
  };
  QRCode.prototype.setupAlign = function(){
    const pos = PATTERN_POS[this.typeNumber-1];
    for(let i=0;i<pos.length;i++){
      for(let j=0;j<pos.length;j++){
        const row=pos[i], col=pos[j];
        if(this.modules[row][col]!==null) continue;
        for(let r=-2;r<=2;r++){
          for(let c=-2;c<=2;c++){
            this.modules[row+r][col+c] = (r===-2||r===2||c===-2||c===2||(r===0&&c===0));
          }
        }
      }
    }
  };
  QRCode.prototype.setupTypeInfo = function(){
    const data = (1<<3)|0;
    const bits = bchTypeInfo(data);
    for(let i=0;i<15;i++){
      const mod = ((bits>>i)&1)===1;
      if(i<6){ this.modules[i][8]=mod; }
      else if(i<8){ this.modules[i+1][8]=mod; }
      else { this.modules[this.moduleCount-15+i][8]=mod; }
    }
    for(let i=0;i<15;i++){
      const mod = ((bits>>i)&1)===1;
      if(i<8){ this.modules[8][this.moduleCount-i-1]=mod; }
      else if(i<9){ this.modules[8][15-i-1+1]=mod; }
      else { this.modules[8][15-i-1]=mod; }
    }
    this.modules[this.moduleCount-8][8] = true;
  };
  QRCode.prototype.setupTypeNumber = function(){
    if(this.typeNumber<7) return;
    const bits = bchTypeNumber(this.typeNumber);
    for(let i=0;i<18;i++){
      const mod = ((bits>>i)&1)===1;
      this.modules[Math.floor(i/3)][i%3+this.moduleCount-8-3] = mod;
    }
    for(let i=0;i<18;i++){
      const mod = ((bits>>i)&1)===1;
      this.modules[i%3+this.moduleCount-8-3][Math.floor(i/3)] = mod;
    }
  };
  QRCode.prototype.mapData = function(data){
    let inc=-1, row=this.moduleCount-1, bitIndex=7, byteIndex=0;
    for(let col=this.moduleCount-1; col>0; col-=2){
      if(col===6) col--;
      while(true){
        for(let c=0;c<2;c++){
          if(this.modules[row][col-c]===null){
            let dark=false;
            if(byteIndex<data.length){ dark = ((data[byteIndex]>>>bitIndex)&1)===1; }
            if((row+(col-c))%2===0){ dark=!dark; }
            this.modules[row][col-c]=dark;
            bitIndex--;
            if(bitIndex===-1){ byteIndex++; bitIndex=7; }
          }
        }
        row+=inc;
        if(row<0||this.moduleCount<=row){ row-=inc; inc=-inc; break; }
      }
    }
  };
  QRCode.prototype.make = function(bytes){
    this.setupFinder(0,0);
    this.setupFinder(this.moduleCount-7,0);
    this.setupFinder(0,this.moduleCount-7);
    this.setupAlign();
    this.setupTiming();
    this.setupTypeInfo();
    this.setupTypeNumber();
    this.mapData(createData(this.typeNumber, bytes));
  };

  function generateSvg(text, pixelSize){
    try{
      const bytes = [];
      for(let i=0;i<text.length;i++){ bytes.push(text.charCodeAt(i)&0xff); }
      const version = selectVersion(bytes.length);
      const qr = new QRCode(version);
      qr.make(bytes);
      const count = qr.moduleCount, quiet=4, total=count+quiet*2, unit=pixelSize/total;
      let rects='';
      for(let r=0;r<count;r++){
        for(let c=0;c<count;c++){
          if(qr.modules[r][c]){ rects += `<rect x="${(c+quiet)*unit}" y="${(r+quiet)*unit}" width="${unit}" height="${unit}"/>`; }
        }
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${pixelSize} ${pixelSize}" width="${pixelSize}" height="${pixelSize}" role="img" aria-label="QR-Code"><rect width="100%" height="100%" fill="#fff"/><g fill="#141414">${rects}</g></svg>`;
    }catch(e){ console.error('QR generation failed', e); return null; }
  }
  return { generateSvg };
})();

/* ---------------- Landing ---------------- */
function renderLanding(){
  document.getElementById('app').innerHTML = `
    <div class="landing">
      <div class="landing-inner">
        <h1>Live-Quiz für die Vorlesung</h1>
        <p class="sub">Eine Frage, vier Antworten, ein Klick. Fragen live an alle stellen und sofort sehen, wer richtig lag.</p>
        <div class="role-row">
          <div class="role-card" onclick="location.hash=DOZENT_HASH">
            <div class="kicker">Für den Laptop im Hörsaal</div>
            <h3>Ich bin Dozent:in</h3>
            <p>Frage vorbereiten, Quiz starten und beenden, Ergebnisse ansehen.</p>
          </div>
          <div class="role-card" onclick="location.hash='#student'">
            <div class="kicker">Für das Smartphone im Hörsaal</div>
            <h3>Ich bin Studierende:r</h3>
            <p>Ohne Anmeldung mitmachen: Frage beantworten und direktes Feedback erhalten.</p>
          </div>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   DOZENT
   ========================================================= */
function renderDozentEntry(){
  if(!dozentUser){ renderDozentLogin(); return; }
  loadDozentData();
}

function renderDozentLogin(){
  document.getElementById('app').innerHTML = `
    <div class="landing">
      <div class="panel" style="max-width:340px; width:100%;">
        <h3 style="margin-top:0;">Dozenten-Zugang</h3>
        <p class="small-note" style="margin-top:0;">Anmeldung mit dem Firebase-Konto, das du im Firebase-Console unter "Authentication" angelegt hast.</p>
        <label>E-Mail</label>
        <input type="email" id="login-email" placeholder="dein@konto.de">
        <label>Passwort</label>
        <input type="password" id="login-pw" placeholder="Passwort" onkeydown="if(event.key==='Enter') doLogin()">
        <div class="btn-row"><button class="btn" onclick="doLogin()">Anmelden</button></div>
        <p class="small-note" id="login-error" style="color:var(--red);"></p>
      </div>
    </div>
  `;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){
    errEl.textContent = 'Anmeldung fehlgeschlagen: ' + (e && e.message || e);
  }
}

function doLogout(){
  detachAllListeners();
  auth.signOut();
}

async function loadDozentData(){
  storageError = null;
  try{
    const snap = await db.ref('quiz/current').once('value');
    currentQuiz = snap.val();
    const draftSnap = await db.ref('quiz/draft').once('value');
    if(draftSnap.val()){ draft = draftSnap.val(); }
  }catch(e){ storageError = String(e && e.message || e); }

  if(currentQuiz && currentQuiz.status === 'open'){ dozentPhase = 'run'; }
  else if(currentQuiz && currentQuiz.status === 'closed'){ dozentPhase = 'results'; }
  else { dozentPhase = 'edit'; }

  renderDozent();
  if(currentQuiz && currentQuiz.status === 'open'){ attachAnswerListener(currentQuiz.quizId); }
}

let draftSaveTimer = null;
function scheduleDraftSave(){
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(() => { db.ref('quiz/draft').set(draft).catch(()=>{}); }, 500);
}
function updateDraftQuestion(v){ draft.question = v; scheduleDraftSave(); }
function updateDraftOption(i, v){ draft.options[i] = v; scheduleDraftSave(); }
function updateDraftCorrect(i){ draft.correctIndex = i; scheduleDraftSave(); renderDozent(); }

function draftIsValid(){
  return draft.question.trim().length > 0
    && draft.options.every(o => o.trim().length > 0)
    && draft.correctIndex !== null && draft.correctIndex !== undefined;
}

function finishEditing(){ if(!draftIsValid()) return; dozentPhase = 'run'; renderDozent(); }
function backToEditing(){ dozentPhase = 'edit'; renderDozent(); }

async function launchQuiz(){
  if(!draftIsValid()) return;
  const quizId = 'q_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  currentQuiz = {
    quizId, status: 'open',
    question: draft.question.trim(),
    options: draft.options.map(o => o.trim()),
    correctIndex: draft.correctIndex,
    openedAt: Date.now(),
    results: null
  };
  storageError = null;
  try{ await db.ref('quiz/current').set(currentQuiz); }
  catch(e){ storageError = String(e && e.message || e); }
  liveCount = 0;
  renderDozent();
  attachAnswerListener(quizId);
}

function attachAnswerListener(quizId){
  detachAnswerListener();
  answersListenerRef = db.ref('quiz/answers/' + quizId);
  answersListenerRef.on('value', snap => {
    liveCount = snap.numChildren();
    const el = document.getElementById('live-count-val');
    if(el){ el.textContent = liveCount; }
  }, err => { storageError = String(err && err.message || err); renderDozent(); });
}

async function closeQuiz(){
  detachAnswerListener();
  const answers = [];
  storageError = null;
  try{
    const snap = await db.ref('quiz/answers/' + currentQuiz.quizId).once('value');
    snap.forEach(child => {
      const v = child.val() || {};
      answers.push({ studentId: child.key, optionIndex: v.optionIndex, ts: v.ts });
      return false;
    });
  }catch(e){ storageError = String(e && e.message || e); }

  const counts = [0,0,0,0];
  answers.forEach(a => { if(a.optionIndex >= 0 && a.optionIndex < 4) counts[a.optionIndex]++; });

  const correctAnswers = answers
    .filter(a => a.optionIndex === currentQuiz.correctIndex)
    .sort((a,b) => a.ts - b.ts);

  const firstResponderId = correctAnswers.length ? correctAnswers[0].studentId : null;
  const luckyStrikeId = correctAnswers.length
    ? correctAnswers[Math.floor(Math.random() * correctAnswers.length)].studentId
    : null;

  currentQuiz = { ...currentQuiz, status: 'closed', results: { counts, total: answers.length, firstResponderId, luckyStrikeId } };
  try{ await db.ref('quiz/current').set(currentQuiz); }
  catch(e){ storageError = String(e && e.message || e); }

  dozentPhase = 'results';
  renderDozent();
}

function newQuestion(){
  draft = { question:'', options:['','','',''], correctIndex:null };
  db.ref('quiz/draft').set(draft).catch(()=>{});
  dozentPhase = 'edit';
  renderDozent();
}

function renderQrBlock(){
  const url = studentUrl();
  const qrSvg = QRLib.generateSvg(url, 220);
  return `
    <div class="panel qr-box">
      ${qrSvg ? `<div style="display:inline-block; background:#fff; padding:10px; border-radius:6px;">${qrSvg}</div>` : '<p class="small-note">QR-Code konnte nicht erzeugt werden — bitte den Link unten verwenden.</p>'}
      <div class="qr-link">${url}</div>
      <p class="small-note">QR-Code oder Link auf die Leinwand projizieren. Studierende brauchen kein Login.</p>
    </div>
  `;
}

function renderDozent(){
  if(dozentPhase === 'edit'){ renderDozentEdit(); return; }
  if(dozentPhase === 'run'){ renderDozentRun(); return; }
  if(dozentPhase === 'results'){ renderDozentResults(); return; }
}

function dozentShell(inner){
  document.getElementById('app').innerHTML = `
    <div class="top-nav">
      <div class="brand">Live-Quiz — Dozenten-Ansicht</div>
      <div class="nav-links">
        <a onclick="location.hash=''">Startseite</a>
        <a onclick="doLogout()">Abmelden</a>
      </div>
    </div>
    <div class="wrap">
      ${storageWarningBanner()}
      ${inner}
    </div>
  `;
}

function renderDozentEdit(){
  const mainBlock = `
    <div class="panel">
      <h2 style="margin-top:0;">Frage vorbereiten</h2>
      <label>Frage</label>
      <textarea oninput="updateDraftQuestion(this.value)" placeholder="Wie lautet die Frage?">${escapeHtml(draft.question)}</textarea>
      <label>Antwortmöglichkeiten (richtige Antwort markieren)</label>
      ${[0,1,2,3].map(i => `
        <div class="opt-row o${i}">
          <span class="opt-dot"></span>
          <input type="text" value="${escapeHtml(draft.options[i])}" placeholder="Antwort ${i+1}" oninput="updateDraftOption(${i}, this.value)">
          <input type="radio" name="correct" class="radio-correct" ${draft.correctIndex===i ? 'checked' : ''} onchange="updateDraftCorrect(${i})" title="Als richtige Antwort markieren">
        </div>
      `).join('')}
      <div class="btn-row">
        <button class="btn" ${draftIsValid() ? '' : 'disabled'} onclick="finishEditing()">Fertig</button>
      </div>
    </div>
  `;
  dozentShell(`<div class="grid-2"><div>${mainBlock}</div><div>${renderQrBlock()}</div></div>`);
}

function renderDozentRun(){
  const isOpen = currentQuiz && currentQuiz.status === 'open';
  const mainBlock = `
    <div class="panel">
      <div class="pill ${isOpen ? 'open' : 'idle'}">${isOpen ? 'Quiz läuft' : 'Bereit zum Starten'}</div>
      <label>Eingegangene Antworten</label>
      <div class="live-count" id="live-count-val">${isOpen ? liveCount : 0}</div>
      <div class="btn-row">
        ${isOpen
          ? '<button class="btn danger" onclick="closeQuiz()">Quiz beenden</button>'
          : '<button class="btn" onclick="launchQuiz()">Quiz starten</button>'}
      </div>
      ${!isOpen ? '<p class="small-note"><a onclick="backToEditing()">Frage nochmal bearbeiten</a></p>' : '<p class="small-note">Frage und Antworten werden nur auf den Handys der Studierenden angezeigt.</p>'}
    </div>
  `;
  dozentShell(`<div class="grid-2"><div>${mainBlock}</div><div>${renderQrBlock()}</div></div>`);
}

function renderDozentResults(){
  const r = currentQuiz.results || { counts:[0,0,0,0], total:0 };
  const max = Math.max(1, ...r.counts);
  const MAX_BAR_PX = 150;
  const bars = currentQuiz.options.map((o,i) => {
    const barPx = Math.max(16, Math.round((r.counts[i]/max) * MAX_BAR_PX));
    const isCorrect = i === currentQuiz.correctIndex;
    const color = `var(--${OPTION_COLORS[i]})`;
    return `
      <div class="bar3d-col">
        <div class="bar3d-count">${r.counts[i]}</div>
        <div class="bar3d-cyl-wrap" style="height:${barPx}px;">
          ${isCorrect ? '<div class="bar3d-correct-badge">richtig</div>' : ''}
          <div class="bar3d-cyl-top" style="background:${color};"></div>
          <div class="bar3d-cyl-body" style="background:linear-gradient(90deg, rgba(0,0,0,.4), rgba(255,255,255,.22) 28%, ${color} 55%, rgba(0,0,0,.45) 100%);"></div>
          <div class="bar3d-cyl-bottom" style="background:${color};"></div>
          <div class="bar3d-shadow"></div>
        </div>
        <div class="bar3d-label">${escapeHtml(o)}</div>
      </div>
    `;
  }).join('');

  const mainBlock = `
    <div class="panel">
      <h2 style="margin-top:0;">Ergebnis: ${escapeHtml(currentQuiz.question)}</h2>
      <p class="small-note" style="margin-top:0;">${r.total} Antwort${r.total===1?'':'en'} insgesamt</p>
      <div class="bar3d-chart">${bars}</div>
      <div class="btn-row">
        <button class="btn" onclick="newQuestion()">Neue Frage</button>
      </div>
    </div>
  `;
  dozentShell(mainBlock);
}

/* =========================================================
   STUDENT
   ========================================================= */
function startStudent(){
  db.ref('quiz/current').on('value', snap => {
    currentQuiz = snap.val();
    renderStudent();
  }, err => { storageError = String(err && err.message || err); renderStudent(); });
}

async function submitAnswer(optionIndex){
  if(!currentQuiz || currentQuiz.status !== 'open') return;
  if(studentAnsweredQuizId === currentQuiz.quizId) return;
  studentAnsweredQuizId = currentQuiz.quizId;
  studentSelected = optionIndex;
  renderStudent();
  try{
    await db.ref('quiz/answers/' + currentQuiz.quizId + '/' + studentId).set({
      optionIndex,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
  }catch(e){ storageError = String(e && e.message || e); renderStudent(); }
}

function renderStudent(){
  const app = document.getElementById('app');

  if(!currentQuiz || currentQuiz.status === 'idle'){
    app.innerHTML = waitingScreen('Noch keine aktive Frage', 'Sobald der/die Dozent:in ein Quiz startet, erscheint die Frage hier automatisch.');
    return;
  }

  if(currentQuiz.status === 'open'){
    const alreadyAnswered = studentAnsweredQuizId === currentQuiz.quizId;
    app.innerHTML = `
      <div class="student-wrap">
        ${storageWarningBanner()}
        <div class="question-card">
          <div class="qtext">${escapeHtml(currentQuiz.question)}</div>
          <div class="options-grid">
            ${currentQuiz.options.map((o,i) => `
              <button class="opt-btn o${i} ${studentSelected===i ? 'picked' : ''}"
                ${alreadyAnswered ? 'disabled' : ''}
                onclick="submitAnswer(${i})">${escapeHtml(o)}</button>
            `).join('')}
          </div>
          ${alreadyAnswered ? '<p class="small-note">Antwort gesendet. Warte auf die Auswertung …</p><div class="dot-pulse"></div>' : ''}
        </div>
      </div>
    `;
    return;
  }

  if(currentQuiz.status === 'closed'){
    const didAnswer = studentAnsweredQuizId === currentQuiz.quizId;
    if(!didAnswer){
      app.innerHTML = waitingScreen('Diese Frage ist beendet', 'Du hast bei dieser Frage nicht mitgemacht. Warte auf die nächste Frage.');
      return;
    }

    const r = currentQuiz.results || {};
    const isFirst = r.firstResponderId === studentId;
    const isLucky = r.luckyStrikeId === studentId;

    if(isFirst && isLucky){
      if(flashSequenceQuizId !== currentQuiz.quizId){
        flashSequenceQuizId = currentQuiz.quizId;
        flashStage = 'first';
        setTimeout(() => { flashStage = 'lucky'; renderStudent(); }, 2600);
      }
      app.innerHTML = flashStage === 'lucky'
        ? flashScreen('green', 'Lucky Strike', 'Und du warst schon First Responder — doppeltes Glück!')
        : flashScreen('blue', 'First Responder', 'Du hattest als Erste:r die richtige Antwort. Gleich kommt noch mehr …');
      return;
    }
    if(isFirst){ app.innerHTML = flashScreen('blue', 'First Responder', 'Du hattest als Erste:r die richtige Antwort.'); return; }
    if(isLucky){ app.innerHTML = flashScreen('green', 'Lucky Strike', 'Zufällig ausgewählt — du hast Glück gehabt!'); return; }

    const wasCorrect = studentSelected === currentQuiz.correctIndex;
    app.innerHTML = `
      <div class="student-wrap">
        <div class="panel result-card">
          <div class="verdict ${wasCorrect ? 'correct' : 'wrong'}">${wasCorrect ? 'Richtig beantwortet' : 'Leider falsch'}</div>
          <div class="answer-line">Richtige Antwort: ${escapeHtml(currentQuiz.options[currentQuiz.correctIndex])}</div>
          <p class="small-note">Warte auf die nächste Frage …</p>
        </div>
      </div>
    `;
    return;
  }
}

function waitingScreen(title, sub){
  return `
    <div class="student-wrap waiting">
      ${storageWarningBanner()}
      <div class="display">${escapeHtml(title)}</div>
      <p>${escapeHtml(sub)}</p>
      <div class="dot-pulse"></div>
    </div>
  `;
}

function flashScreen(color, title, sub){
  return `
    <div class="result-flash ${color}">
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(sub)}</p>
    </div>
  `;
}
